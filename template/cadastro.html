<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta — My Rep</title>
<meta name="description" content="Crie sua conta My Rep com e-mail e senha para assinar um plano.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/img/favicon.png" type="image/png">
<script>window.MYREP_SUPABASE={{MYREP_SUPABASE}};</script>
</head>
<body class="pagina-auth">

<header class="briefing-topo">
  <a class="marca marca--compacta" href="/">
    <img src="/img/logo.png" alt="My Rep" width="36" height="36">
  </a>
  <p class="eyebrow">Cadastro</p>
</header>

<main class="auth-shell">
  <header class="auth-intro">
    <h1 class="auth-intro__titulo">Criar sua conta</h1>
    <p class="auth-intro__texto">Cadastre-se com e-mail e senha. Os dados abaixo são os da cobrança na Asaas.</p>
  </header>

  <form class="auth-form" id="form-cadastro" novalidate>
    <label class="campo">
      <span class="campo__rotulo">Nome completo ou razão social <abbr title="obrigatório">*</abbr></span>
      <input name="nome" id="cadastro-nome" type="text" required autocomplete="name" maxlength="80" placeholder="Seu nome">
    </label>
    <label class="campo">
      <span class="campo__rotulo">CPF ou CNPJ <abbr title="obrigatório">*</abbr></span>
      <input name="documento" id="cadastro-documento" type="text" required inputmode="numeric" autocomplete="off" maxlength="18" placeholder="000.000.000-00">
    </label>
    <label class="campo">
      <span class="campo__rotulo">Celular com DDD <abbr title="obrigatório">*</abbr></span>
      <input name="celular" id="cadastro-celular" type="tel" required inputmode="tel" autocomplete="tel" maxlength="15" placeholder="(11) 99999-9999">
    </label>
    <label class="campo">
      <span class="campo__rotulo">CEP <abbr title="obrigatório">*</abbr></span>
      <input name="cep" id="cadastro-cep" type="text" required inputmode="numeric" autocomplete="postal-code" maxlength="9" placeholder="00000-000">
    </label>
    <label class="campo">
      <span class="campo__rotulo">Rua <abbr title="obrigatório">*</abbr></span>
      <input name="endereco" id="cadastro-endereco" type="text" required autocomplete="address-line1" maxlength="255" placeholder="Preenchida pelo CEP">
    </label>
    <label class="campo">
      <span class="campo__rotulo">Número <abbr title="obrigatório">*</abbr></span>
      <input name="numero" id="cadastro-numero" type="text" required autocomplete="off" maxlength="20" placeholder="123">
    </label>
    <label class="campo">
      <span class="campo__rotulo">Bairro <abbr title="obrigatório">*</abbr></span>
      <input name="bairro" id="cadastro-bairro" type="text" required autocomplete="off" maxlength="80" placeholder="Preenchido pelo CEP">
    </label>
    <label class="campo">
      <span class="campo__rotulo">Complemento</span>
      <input name="complemento" id="cadastro-complemento" type="text" autocomplete="address-line2" maxlength="255" placeholder="Apto, sala, bloco">
    </label>
    <label class="campo">
      <span class="campo__rotulo">Cidade</span>
      <input name="cidade" id="cadastro-cidade" type="text" autocomplete="address-level2" maxlength="80">
    </label>
    <label class="campo">
      <span class="campo__rotulo">UF</span>
      <input name="uf" id="cadastro-uf" type="text" autocomplete="address-level1" maxlength="2" placeholder="SP">
    </label>
    <label class="campo">
      <span class="campo__rotulo">E-mail <abbr title="obrigatório">*</abbr></span>
      <input name="email" type="email" required autocomplete="email" maxlength="160" placeholder="voce@email.com">
    </label>
    <label class="campo">
      <span class="campo__rotulo">Senha <abbr title="obrigatório">*</abbr></span>
      <input name="senha" type="password" required autocomplete="new-password" minlength="6" maxlength="72" placeholder="Mínimo 6 caracteres">
    </label>
    <label class="campo">
      <span class="campo__rotulo">Confirmar senha <abbr title="obrigatório">*</abbr></span>
      <input name="senha2" type="password" required autocomplete="new-password" minlength="6" maxlength="72">
    </label>
    <label class="campo">
      <span class="campo__rotulo">Código <span class="campo__opcional">(opcional)</span></span>
      <input name="codigo_vitalicio" type="text" autocomplete="off" maxlength="20" placeholder="MYREP-XXXXXX" spellcheck="false">
    </label>

    <label class="opcao opcao--termos">
      <input type="checkbox" name="aceite_termos" id="aceite-termos" required>
      <span>Li e aceito os <a href="/termos/" target="_blank" rel="noopener">Termos de uso</a> e a <a href="/termos/#privacidade" target="_blank" rel="noopener">Política de privacidade</a></span>
    </label>

    <p class="briefing-status" id="auth-status" role="status" aria-live="polite"></p>
    <button class="btn btn--primario" type="submit" id="btn-cadastro">Criar conta</button>
  </form>

  <p class="auth-rodape">Já tem conta? <a href="/entrar/">Entrar</a></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js" defer></script>
<script src="/js/supabase-client.js" defer></script>
<script src="/js/cep.js" defer></script>
<script src="/js/mascaras.js" defer></script>
<script src="/js/auth-pages.js" defer></script>
</body>
</html>
