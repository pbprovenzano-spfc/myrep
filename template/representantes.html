<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Representantes — My Rep</title>
<meta name="description" content="Diretório interno de representantes My Rep.">
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/img/favicon.png" type="image/png">
</head>
<body class="pagina-reps">

<main class="shell shell--estreito">

  <header class="reps__capa">
    <p class="marca marca--compacta">
      <img src="/img/logo.png" alt="My Rep" width="36" height="36">
    </p>
    <h1 class="reps__titulo">Representantes</h1>
    <p class="reps__sub">Diretório interno — {{TOTAL}} perfis cadastrados.</p>
  </header>

  <section class="reps__busca">
    <label class="rotulo" for="busca">Buscar</label>
    <input type="search" id="busca" class="campo" placeholder="Nome, marca, estado ou segmento" autocomplete="off">
    <p class="reps__contagem" id="contagem" role="status"></p>
  </section>

  <section class="reps__lista">
    <ul class="fichas" id="fichas">
{{FICHAS}}
    </ul>
    <p class="reps__vazio" id="vazio" hidden>Nenhum representante encontrado. Tente outro termo.</p>
  </section>

  <footer class="rodape">
    <p class="rodape__creditos"><a class="marca marca--compacta" href="/"><img src="/img/logo.png" alt="My Rep" width="28" height="28"></a></p>
  </footer>

</main>

<script src="/js/representantes.js"></script>
</body>
</html>
