<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITULO}}</title>
<meta name="description" content="{{DESCRICAO}}">

<meta property="og:type" content="profile">
<meta property="og:title" content="{{TITULO}}">
<meta property="og:description" content="{{DESCRICAO}}">
<meta property="og:image" content="{{FOTO}}">
<meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/img/favicon.png" type="image/png">
{{PALETA_CSS}}
</head>
<body class="{{BODY_CLASS}}">

<main class="shell shell--estreito cartao">

  <div class="cartao__perfil">
    <header class="capa">
      {{FOTO_CAPA}}
      {{ANTES_NOME}}
      <h1 class="capa__nome">{{NOME}}</h1>
      {{DEPOIS_NOME}}
      {{CARGO}}
      {{BIO}}
    </header>

    <div class="acoes">
      {{ZAP}}
    </div>
  </div>

  <div class="cartao__blocos">
{{BLOCOS}}
  </div>

  <footer class="rodape">
    <a class="rodape-cta" href="/">
      <span class="rodape-cta__selo">
        <img src="/img/logo.png" alt="" width="36" height="36">
      </span>
      <span class="rodape-cta__texto">
        <span class="rodape-cta__rotulo">Feito com My Rep</span>
        <strong class="rodape-cta__titulo">Crie seu My Rep</strong>
        <span class="rodape-cta__sub">Sua página de representante. Um link. Pronto.</span>
      </span>
      <span class="rodape-cta__seta" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
      </span>
    </a>
  </footer>

</main>

<script src="/js/mapa.js"></script>
</body>
</html>
