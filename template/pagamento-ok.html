<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento — My Rep</title>
<meta name="description" content="Confirme seu pagamento My Rep e acesse o painel para montar sua página.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/img/favicon.png" type="image/png">
</head>
<body class="pagina-pagamento">

<header class="briefing-topo">
  <a class="marca marca--compacta" href="/">
    <img src="/img/logo.png" alt="My Rep" width="36" height="36">
  </a>
  <p class="eyebrow">Pagamento</p>
</header>

<main class="pagamento-shell">
  <header class="pagamento-intro">
    <h1 class="pagamento-intro__titulo">Pagamento recebido</h1>
    <p class="pagamento-intro__texto" id="pagamento-plano-texto">Entre no painel com a mesma conta ou e-mail usado no pagamento para montar e publicar sua página.</p>
  </header>

  <div class="painel-acoes" style="margin-bottom:24px">
    <a class="btn btn--primario" href="/painel/">Abrir meu painel</a>
    <a class="btn btn--fantasma-ink" href="/entrar/?next=/painel/">Entrar</a>
  </div>

  <p class="pagamento-voltar"><a href="/">Voltar ao início</a></p>
</main>

<script src="/js/pagamento.js" defer></script>
</body>
</html>
